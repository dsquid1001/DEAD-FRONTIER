<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b0c">
<title>DEAD FRONTIER</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="status"><span>HP</span><div class="bar"><i id="hpbar"></i></div></div>
  <div id="ammo"><b id="mag">12</b> / <span id="reserve">48</span></div>
  <div id="weaponName">RAVEN-9</div>
  <div id="crosshair">+</div>
  <div id="message"></div>
  <div id="damage"></div>
  <div id="gameOver"><strong>YOU DIED</strong><button id="restart">RESTART</button></div>
</div>
<div id="joystick"><div id="stick"></div></div>
<div id="lookArea"></div>
<div id="buttons">
  <button id="fire">FIRE</button>
  <button id="reload">RELOAD</button>
  <button id="jump">JUMP</button>
</div>
<div id="hint">左下：移動　右側：視点　FIRE：射撃</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
